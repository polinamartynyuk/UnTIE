<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc">
  <title id="title">Компонентная схема взаимодействия программных модулей UnTIE</title>
  <desc id="desc">Взаимодействие диспетчера запроса, модулей документа, B0, QA, признаков, решения H2/H3 и результата. Интерфейс и хранилище являются внешними системами.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#334155"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#15803d"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 30px 'DejaVu Sans',Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px 'DejaVu Sans',Arial,sans-serif;fill:#475569}
      .boundary{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:10 8}.training{fill:#f7fee7;stroke:#65a30d;stroke-width:2;stroke-dasharray:10 8}
      .boundary-label{font:700 18px 'DejaVu Sans',Arial,sans-serif;fill:#334155}.external{fill:#f1f5f9;stroke:#475569;stroke-width:2;filter:url(#shadow)}
      .module{fill:#fff;stroke:#64748b;stroke-width:2;filter:url(#shadow)}.blue{fill:#eff6ff;stroke:#3b82f6}.green{fill:#f0fdf4;stroke:#22c55e}
      .purple{fill:#faf5ff;stroke:#a855f7}.amber{fill:#fffbeb;stroke:#f59e0b}.head{font:700 18px 'DejaVu Sans',Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .body{font:400 14px 'DejaVu Sans',Arial,sans-serif;fill:#475569;text-anchor:middle}.small{font:400 12px 'DejaVu Sans',Arial,sans-serif;fill:#64748b;text-anchor:middle}
      .contract{font:600 12px 'DejaVu Sans',Arial,sans-serif;fill:#334155;text-anchor:middle}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
      .request{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow-blue)}.train-flow{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#arrow-green)}
      .config{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.return{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-blue)}
      .label{fill:#fff;opacity:.95}
    </style>
  </defs>
  <rect width="1900" height="1250" fill="#fff"/>
  <text x="950" y="46" class="title" text-anchor="middle">Компонентная схема взаимодействия программных модулей UnTIE</text>
  <text x="950" y="76" class="subtitle" text-anchor="middle">Финальная реализация H3 Consistency Gate</text>

  <rect x="35" y="155" width="220" height="140" rx="12" class="external"/>
  <text x="145" y="197" class="head">Интерфейс загрузки</text>
  <text x="145" y="228" class="body">ввод документа и вопроса</text>
  <text x="145" y="256" class="body">получение результата</text>
  <text x="145" y="282" class="small">существующая внешняя система</text>

  <rect x="300" y="110" width="1370" height="735" rx="18" class="boundary"/>
  <rect x="335" y="96" width="430" height="32" rx="6" fill="#fff"/>
  <text x="350" y="119" class="boundary-label">Подсистема применения метода</text>

  <rect x="345" y="165" width="300" height="110" rx="12" class="module blue"/>
  <text x="495" y="207" class="head">API обработки запроса</text>
  <text x="495" y="238" class="body">контракт обмена с интерфейсом</text>

  <rect x="770" y="155" width="420" height="130" rx="12" class="module blue"/>
  <text x="980" y="202" class="head">Диспетчер запроса</text>
  <text x="980" y="233" class="body">управляет сеансом и вызовами модулей</text>
  <text x="980" y="259" class="small">не содержит логики ранжирования</text>

  <rect x="350" y="385" width="260" height="125" rx="12" class="module"/>
  <text x="480" y="430" class="head">Модуль документов</text>
  <text x="480" y="461" class="body">формирует DocumentContext</text>
  <text x="480" y="487" class="small">текст, фрагменты и координаты</text>

  <rect x="690" y="385" width="260" height="125" rx="12" class="module"/>
  <text x="820" y="430" class="head">Модуль B0</text>
  <text x="820" y="461" class="body">формирует CandidateSet</text>
  <text x="820" y="487" class="small">top-K и резервный top-1</text>

  <rect x="1030" y="385" width="260" height="125" rx="12" class="module green"/>
  <text x="1160" y="430" class="head">Модуль извлечения ответа</text>
  <text x="1160" y="461" class="body">формирует CandidateAnswers</text>
  <text x="1160" y="487" class="small">извлекаемые ответы кандидатов</text>

  <rect x="690" y="625" width="260" height="125" rx="12" class="module green"/>
  <text x="820" y="670" class="head">Модуль признаков</text>
  <text x="820" y="701" class="body">формирует FeatureMatrix</text>
  <text x="820" y="727" class="small">единый контракт H2 и H3</text>

  <rect x="1030" y="625" width="260" height="125" rx="12" class="module purple"/>
  <text x="1160" y="670" class="head">Модуль решения H2/H3</text>
  <text x="1160" y="701" class="body">формирует SelectionDecision</text>
  <text x="1160" y="727" class="small">безопасная замена или возврат к B0</text>

  <rect x="1380" y="485" width="250" height="145" rx="12" class="module amber"/>
  <text x="1505" y="530" class="head">Модуль результата</text>
  <text x="1505" y="561" class="body">формирует ExtractionResult</text>
  <text x="1505" y="589" class="small">ответ и происхождение</text>
  <text x="1505" y="609" class="small">подтверждающего фрагмента</text>

  <path d="M1720 215 C1720 195 1880 195 1880 215 L1880 690 C1880 710 1720 710 1720 690 Z" class="external"/>
  <ellipse cx="1800" cy="215" rx="80" ry="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <ellipse cx="1800" cy="690" rx="80" ry="20" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="1800" y="272" class="head">Хранилище</text>
  <text x="1800" y="312" class="body">документы</text>
  <text x="1800" y="342" class="body">модели</text>
  <text x="1800" y="372" class="body">профили и параметры</text>
  <text x="1800" y="402" class="body">результаты</text>
  <text x="1800" y="432" class="body">журналы</text>
  <text x="1800" y="661" class="small">внешняя система</text>

  <path d="M255 195 H345" class="request"/><rect x="268" y="164" width="65" height="21" rx="4" class="label"/><text x="300" y="179" class="contract">Request</text>
  <path d="M645 220 H770" class="request"/><rect x="666" y="188" width="82" height="21" rx="4" class="label"/><text x="707" y="203" class="contract">Validated</text>
  <path d="M770 250 H705 V315 H480 V385" class="flow"/><rect x="552" y="302" width="130" height="21" rx="4" class="label"/><text x="617" y="317" class="contract">DocumentRequest</text>

  <path d="M610 447 H650 V350 H820 V385" class="flow"/><rect x="675" y="330" width="120" height="21" rx="4" class="label"/><text x="735" y="345" class="contract">DocumentContext</text>
  <path d="M950 447 H990 V350 H1160 V385" class="flow"/><rect x="1015" y="330" width="120" height="21" rx="4" class="label"/><text x="1075" y="345" class="contract">CandidateSet</text>
  <path d="M820 510 V625" class="flow"/><rect x="752" y="554" width="136" height="21" rx="4" class="label"/><text x="820" y="569" class="contract">RankingSignals</text>
  <path d="M1160 510 V570 H900 V625" class="flow"/><rect x="968" y="538" width="126" height="21" rx="4" class="label"/><text x="1031" y="553" class="contract">AnswerSignals</text>
  <path d="M950 687 H990 V600 H1160 V625" class="flow"/><rect x="1015" y="590" width="120" height="21" rx="4" class="label"/><text x="1075" y="605" class="contract">FeatureMatrix</text>
  <path d="M1290 687 H1340 V557 H1380" class="flow"/><rect x="1283" y="581" width="114" height="21" rx="4" class="label"/><text x="1340" y="596" class="contract">SelectionDecision</text>
  <path d="M1290 447 H1345 V520 H1380" class="flow"/><rect x="1287" y="456" width="119" height="21" rx="4" class="label"/><text x="1346" y="471" class="contract">CandidateAnswers</text>
  <path d="M480 510 V790 H1505 V630" class="flow"/><rect x="905" y="758" width="164" height="21" rx="4" class="label"/><text x="987" y="773" class="contract">SourceCoordinates</text>

  <path d="M1505 485 V320 H1190 V265" class="return"/><rect x="1320" y="289" width="116" height="21" rx="4" class="label"/><text x="1378" y="304" class="contract">ExtractionResult</text>
  <path d="M770 190 H690 V135 H495 V165" class="return"/>
  <path d="M345 245 H255" class="return"/><rect x="269" y="252" width="62" height="21" rx="4" class="label"/><text x="300" y="267" class="contract">Result</text>

  <path d="M1720 300 H1680 V205 H1190" class="config"/><rect x="1450" y="172" width="159" height="21" rx="4" class="label"/><text x="1529" y="187" class="contract">RuntimeResources</text>
  <path d="M1720 420 H1695 V687 H1290" class="config"/><rect x="1471" y="654" width="118" height="21" rx="4" class="label"/><text x="1530" y="669" class="contract">FrozenPolicy</text>
  <path d="M1630 590 H1720" class="config"/><rect x="1640" y="557" width="91" height="21" rx="4" class="label"/><text x="1685" y="572" class="contract">AuditRecord</text>

  <rect x="300" y="910" width="1370" height="255" rx="18" class="training"/>
  <rect x="335" y="896" width="495" height="32" rx="6" fill="#fff"/>
  <text x="350" y="919" class="boundary-label">Подсистема обучения и фиксации политики</text>

  <rect x="390" y="975" width="300" height="120" rx="12" class="module green"/>
  <text x="540" y="1018" class="head">Модуль обучения H2/H3</text>
  <text x="540" y="1049" class="body">создаёт версии utility/harm моделей</text>
  <text x="540" y="1075" class="small">использует общий контракт признаков</text>

  <rect x="800" y="975" width="300" height="120" rx="12" class="module green"/>
  <text x="950" y="1018" class="head">Модуль OOF-оценки</text>
  <text x="950" y="1049" class="body">формирует OOFSelection</text>
  <text x="950" y="1075" class="small">TRAIN и TRAIN+VAL по документам</text>

  <rect x="1210" y="975" width="300" height="120" rx="12" class="module purple"/>
  <text x="1360" y="1018" class="head">Модуль consistency gate</text>
  <text x="1360" y="1049" class="body">формирует FrozenPolicy</text>
  <text x="1360" y="1075" class="small">при расхождении выбирает исходный H3</text>

  <path d="M690 1035 H800" class="train-flow"/><rect x="700" y="1002" width="91" height="21" rx="4" class="label"/><text x="745" y="1017" class="contract">PolicyModels</text>
  <path d="M1100 1035 H1210" class="train-flow"/><rect x="1106" y="1002" width="99" height="21" rx="4" class="label"/><text x="1155" y="1017" class="contract">OOFSelection</text>
  <path d="M540 1095 V1135 H1360 V1095" class="config"/><rect x="900" y="1102" width="100" height="21" rx="4" class="label"/><text x="950" y="1117" class="contract">PolicyModels</text>
  <path d="M820 750 V860 H540 V975" class="config"/><rect x="617" y="828" width="126" height="21" rx="4" class="label"/><text x="680" y="843" class="contract">FeatureBuilder</text>
  <path d="M1720 640 H1705 V945 H540 V975" class="config"/><rect x="1507" y="913" width="132" height="21" rx="4" class="label"/><text x="1573" y="928" class="contract">TrainingDataset</text>
  <path d="M1510 1035 H1705 V725 H1720" class="config"/><rect x="1551" y="1002" width="118" height="21" rx="4" class="label"/><text x="1610" y="1017" class="contract">FrozenPolicy</text>

  <line x1="460" y1="1208" x2="535" y2="1208" class="request"/><text x="550" y="1213" class="body" text-anchor="start">запрос и результат</text>
  <line x1="805" y1="1208" x2="880" y2="1208" class="flow"/><text x="895" y="1213" class="body" text-anchor="start">обмен между модулями</text>
  <line x1="1205" y1="1208" x2="1280" y2="1208" class="config"/><text x="1295" y="1213" class="body" text-anchor="start">артефакты и конфигурация</text>
</svg>
